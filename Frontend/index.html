<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClubMaster - Iniciar sesion</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap');

        * { margin: 0; padding: 0; }
        *, *::before, *::after { box-sizing: border-box; }

        html { width: 100%; max-width: 100%; overflow-x: hidden; }

        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f0c29 0%, #1a1a2e 40%, #16213e 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            overflow-y: auto;
            position: relative;
            width: 100%;
            max-width: 100%;
        }

        body::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            max-width: 200vw;
            height: 200%;
            pointer-events: none;
            background: radial-gradient(circle at 30% 50%, rgba(255, 165, 0, 0.06) 0%, transparent 50%),
                        radial-gradient(circle at 70% 80%, rgba(255, 200, 50, 0.04) 0%, transparent 40%);
            animation: bgPulse 12s ease-in-out infinite alternate;
        }

        @keyframes bgPulse {
            0% { transform: scale(1) rotate(0deg); }
            100% { transform: scale(1.1) rotate(3deg); }
        }

        .login-wrapper {
            position: relative;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 0;
            max-width: 920px;
            width: 95%;
        }

        /* ========== CERVEZA FLOTANTE ========== */
        .beer-float {
            position: fixed;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            animation: beerFloat 3s ease-in-out infinite;
            filter: drop-shadow(0 10px 30px rgba(255, 165, 0, 0.3));
        }

        .beer-float svg {
            width: 80px;
            height: 80px;
        }

        @keyframes beerFloat {
            0%, 100% { transform: translateX(-50%) translateY(0px) rotate(-2deg); }
            50% { transform: translateX(-50%) translateY(-18px) rotate(2deg); }
        }

        .beer-float::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 6px;
            background: radial-gradient(ellipse, rgba(255, 165, 0, 0.25) 0%, transparent 70%);
            border-radius: 50%;
            animation: beerShadow 3s ease-in-out infinite;
        }

        @keyframes beerShadow {
            0%, 100% { transform: translateX(-50%) scaleX(1); opacity: 0.4; }
            50% { transform: translateX(-50%) scaleX(0.6); opacity: 0.15; }
        }

        /* ========== BURBUJAS ========== */
        .bubbles {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .bubble {
            position: absolute;
            bottom: -20px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(255, 215, 100, 0.3), rgba(255, 165, 0, 0.08));
            border: 1px solid rgba(255, 200, 50, 0.15);
            animation: bubbleUp linear infinite;
        }

        @keyframes bubbleUp {
            0% { transform: translateY(0) translateX(0) scale(1); opacity: 0.6; }
            50% { opacity: 0.3; }
            100% { transform: translateY(-110vh) translateX(30px) scale(0.4); opacity: 0; }
        }

        /* ========== PANEL LOGIN ========== */
        .login-card {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px 0 0 24px;
            padding: 48px 36px 36px;
            width: 50%;
            min-height: 460px;
            position: relative;
        }

        .login-card::before {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: 24px 0 0 24px;
            background: linear-gradient(135deg, rgba(255, 165, 0, 0.15), transparent 60%);
            z-index: -1;
        }

        .login-card h2 {
            color: #ffc832;
            font-weight: 800;
            font-size: 1.5rem;
            text-align: center;
            margin-bottom: 4px;
            text-shadow: 0 0 20px rgba(255, 200, 50, 0.3);
        }

        .login-card .subtitle {
            color: rgba(255, 255, 255, 0.45);
            text-align: center;
            font-size: 0.82rem;
            margin-bottom: 28px;
        }

        .form-floating { margin-bottom: 16px; }

        .form-floating .form-control {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            color: #fff;
            padding: 16px 14px 6px;
            height: 52px;
            font-size: 0.9rem;
            transition: all 0.3s;
        }

        .form-floating .form-control:focus {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 165, 0, 0.5);
            box-shadow: 0 0 0 3px rgba(255, 165, 0, 0.1);
            color: #fff;
        }

        .form-floating .form-control::placeholder { color: transparent; }

        .form-floating label {
            color: rgba(255, 255, 255, 0.45);
            padding: 14px;
            font-size: 0.85rem;
        }

        .form-floating .form-control:focus ~ label,
        .form-floating .form-control:not(:placeholder-shown) ~ label {
            color: #ffc832;
            transform: scale(0.85) translateY(-0.1rem);
        }

        .input-group-text {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-right: none;
            border-radius: 14px 0 0 14px;
            color: #ffc832;
        }

        .input-group .form-control {
            border-left: none;
            border-radius: 0 14px 14px 0;
        }

        .btn-login {
            background: linear-gradient(135deg, #ffc832, #f59e0b);
            border: none;
            border-radius: 14px;
            color: #1a1a2e;
            font-weight: 700;
            font-size: 0.95rem;
            padding: 12px;
            width: 100%;
            margin-top: 8px;
            transition: all 0.3s;
            letter-spacing: 0.5px;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 165, 0, 0.35);
            background: linear-gradient(135deg, #ffd34a, #fbbf24);
        }

        .btn-login:active { transform: translateY(0); }

        .forgot-link {
            display: block;
            text-align: center;
            margin-top: 14px;
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.8rem;
            text-decoration: none;
            transition: color 0.3s;
        }

        .forgot-link:hover { color: #ffc832; }

        /* ========== PANEL REGISTRO (FLLOTANTE) ========== */
        .register-card {
            background: linear-gradient(135deg, rgba(255, 165, 0, 0.12), rgba(245, 158, 11, 0.06));
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 165, 0, 0.2);
            border-left: 1px solid rgba(255, 165, 0, 0.3);
            border-radius: 0 24px 24px 0;
            padding: 40px 32px;
            width: 50%;
            min-height: 460px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
            animation: registerPulse 4s ease-in-out infinite;
        }

        @keyframes registerPulse {
            0%, 100% { box-shadow: 0 0 30px rgba(255, 165, 0, 0.05); }
            50% { box-shadow: 0 0 50px rgba(255, 165, 0, 0.12); }
        }

        .register-card::before {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: 0 24px 24px 0;
            background: linear-gradient(135deg, rgba(255, 165, 0, 0.2), transparent 60%);
            z-index: -1;
        }

        .register-icon {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: rgba(255, 165, 0, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            border: 2px solid rgba(255, 165, 0, 0.2);
        }

        .register-icon i {
            font-size: 2rem;
            color: #ffc832;
        }

        .register-card h3 {
            color: #ffc832;
            font-weight: 700;
            font-size: 1.2rem;
            margin-bottom: 10px;
        }

        .register-card p {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.82rem;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .btn-register {
            background: transparent;
            border: 2px solid rgba(255, 165, 0, 0.4);
            border-radius: 14px;
            color: #ffc832;
            font-weight: 700;
            font-size: 0.9rem;
            padding: 11px 32px;
            transition: all 0.3s;
        }

        .btn-register:hover {
            background: rgba(255, 165, 0, 0.15);
            border-color: #ffc832;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 165, 0, 0.2);
            color: #ffc832;
        }

        /* ========== MODAL RECUPERAR ========== */
        .modal-content {
            background: #1e293b;
            border: 1px solid rgba(255, 165, 0, 0.2);
            border-radius: 20px;
        }

        .modal-header {
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding: 20px 24px;
        }

        .modal-title { color: #ffc832; font-weight: 700; }

        .modal-body { padding: 24px; }

        .modal-footer {
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding: 16px 24px;
        }

        .modal-body .form-control {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #fff;
        }

        .modal-body .form-control:focus {
            border-color: rgba(255, 165, 0, 0.5);
            box-shadow: 0 0 0 3px rgba(255, 165, 0, 0.1);
            color: #fff;
        }

        .modal-body label { color: rgba(255, 255, 255, 0.6); font-size: 0.85rem; }

        .modal-body .text-muted { color: rgba(255, 255, 255, 0.35) !important; font-size: 0.78rem; }

        .btn-close-white { filter: brightness(0) invert(1); }

        /* ========== MENSAJES ========== */
        #mensaje { font-size: 0.85rem; }

        #mensaje .alert {
            border-radius: 12px;
            border: none;
            padding: 12px 16px;
            font-size: 0.82rem;
        }

        .alert-success-custom {
            background: rgba(16, 185, 129, 0.15);
            color: #6ee7b7;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .alert-danger-custom {
            background: rgba(239, 68, 68, 0.15);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        /* ========== RESPONSIVE ========== */
        @media (max-width: 768px) {
            .login-wrapper { flex-direction: column; max-width: 420px; }
            .login-card { border-radius: 24px 24px 0 0; width: 100%; min-height: auto; }
            .register-card { border-radius: 0 0 24px 24px; border-left: 1px solid rgba(255, 165, 0, 0.2); border-top: 1px solid rgba(255, 165, 0, 0.3); width: 100%; min-height: auto; padding: 32px; }
            .beer-float { top: 15px; }
            .beer-float svg { width: 55px; height: 55px; }
        }

        /* ========== SPINNER ========== */
        .spinner-login {
            display: none;
            width: 20px; height: 20px;
            border: 3px solid rgba(26, 26, 46, 0.2);
            border-top-color: #1a1a2e;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .btn-login.loading .btn-text { display: none; }
        .btn-login.loading .spinner-login { display: inline-block; }
    </style>
</head>
<body>

    <!-- CERVEZA FLOTANTE -->
    <div class="beer-float">
        <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="beerGrad" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#ffe066"/>
                    <stop offset="100%" stop-color="#f59e0b"/>
                </linearGradient>
                <linearGradient id="foamGrad" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#fff"/>
                    <stop offset="100%" stop-color="#fef3c7"/>
                </linearGradient>
            </defs>
            <!-- Vaso -->
            <path d="M16 18 L14 54 C14 56 16 58 18 58 L46 58 C48 58 50 56 50 54 L48 18 Z" fill="url(#beerGrad)" opacity="0.85"/>
            <!-- Brillo -->
            <path d="M20 20 L19 52 C19 53 20 54 21 54 L24 54 L25 20 Z" fill="rgba(255,255,255,0.25)"/>
            <!-- Espuma -->
            <ellipse cx="32" cy="17" rx="20" ry="6" fill="url(#foamGrad)"/>
            <circle cx="20" cy="14" r="5" fill="#fff" opacity="0.9"/>
            <circle cx="32" cy="12" r="6" fill="#fff" opacity="0.95"/>
            <circle cx="43" cy="14" r="5" fill="#fff" opacity="0.9"/>
            <circle cx="26" cy="11" r="4" fill="#fef3c7" opacity="0.7"/>
            <circle cx="38" cy="11" r="4" fill="#fef3c7" opacity="0.7"/>
            <!-- Burbujitas internas -->
            <circle cx="25" cy="30" r="1.5" fill="rgba(255,255,255,0.35)"/>
            <circle cx="35" cy="36" r="1.2" fill="rgba(255,255,255,0.3)"/>
            <circle cx="28" cy="42" r="1.8" fill="rgba(255,255,255,0.25)"/>
            <circle cx="38" cy="28" r="1" fill="rgba(255,255,255,0.3)"/>
            <circle cx="32" cy="48" r="1.3" fill="rgba(255,255,255,0.2)"/>
            <!-- Asa -->
            <path d="M50 24 C58 24 58 42 50 42" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
        </svg>
    </div>

    <!-- BURBUJAS DE FONDO -->
    <div class="bubbles" id="bubbles"></div>

    <!-- CONTENEDOR PRINCIPAL -->
    <div class="login-wrapper" style="margin-top: 60px;">

        <!-- PANEL IZQUIERDO: LOGIN -->
        <div class="login-card">
            <h2><i class="bi bi-cup-straw"></i> ClubMaster</h2>
            <p class="subtitle">Inicia sesion para continuar</p>

            <form id="formLogin">
                <div class="input-group mb-3">
                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                    <input type="email" id="correo" class="form-control" placeholder="Correo electronico" required>
                </div>

                <div class="input-group mb-3">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" id="contrasena" class="form-control" placeholder="Contrasena" required>
                    <button class="input-group-text" type="button" id="togglePass" style="cursor:pointer;border-left:none;border-radius:0 14px 14px 0;">
                        <i class="bi bi-eye" id="eyeIcon"></i>
                    </button>
                </div>

                <button type="submit" class="btn-login" id="btnLogin">
                    <span class="btn-text"><i class="bi bi-box-arrow-in-right me-1"></i> Entrar</span>
                    <span class="spinner-login"></span>
                </button>

                <a href="#" class="forgot-link" data-bs-toggle="modal" data-bs-target="#modalRecuperar">
                    <i class="bi bi-question-circle"></i> Olvidaste tu contrasena?
                </a>
            </form>

            <div id="mensaje" class="mt-3"></div>
        </div>

        <!-- PANEL DERECHO: REGISTRO FLOTANTE -->
        <div class="register-card">
            <div class="register-icon">
                <i class="bi bi-person-plus"></i>
            </div>
            <h3>Nuevo aqui?</h3>
            <p>Crea tu cuenta y empieza a gestionar tu negocio como todo un profesional.</p>
            <a href="/registrar" class="btn-register" style="text-decoration:none;display:inline-block">
                <i class="bi bi-pencil-square me-1"></i> Crear cuenta
            </a>
        </div>

    </div>

    <!-- MODAL: RECUPERAR CONTRASENA -->
    <div class="modal fade" id="modalRecuperar" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="bi bi-shield-lock me-2"></i>Recuperar contrasena</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p class="text-muted mb-3">Ingresa tu correo electronico y te enviaremos las instrucciones para restablecer tu contrasena.</p>
                    <label class="form-label">Correo electronico</label>
                    <input type="email" id="correoRecuperar" class="form-control" placeholder="tu@correo.com">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary btn-sm" style="border-radius:10px" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-sm" style="background:#ffc832;color:#1a1a2e;border-radius:10px;font-weight:700" onclick="enviarRecuperacion()">
                        <i class="bi bi-send me-1"></i> Enviar instrucciones
                    </button>
                </div>
                <div id="msgRecuperar" class="px-3 pb-3"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // ========== BURBUJAS ==========
        (function crearBurbujas() {
            var cont = document.getElementById('bubbles');
            for (var i = 0; i < 15; i++) {
                var b = document.createElement('div');
                b.className = 'bubble';
                var size = Math.random() * 18 + 6;
                b.style.width = size + 'px';
                b.style.height = size + 'px';
                b.style.left = Math.random() * 100 + '%';
                b.style.animationDuration = (Math.random() * 8 + 8) + 's';
                b.style.animationDelay = (Math.random() * 10) + 's';
                cont.appendChild(b);
            }
        })();

        // ========== TOGGLE PASSWORD ==========
        document.getElementById('togglePass').addEventListener('click', function() {
            var inp = document.getElementById('contrasena');
            var icon = document.getElementById('eyeIcon');
            if (inp.type === 'password') {
                inp.type = 'text';
                icon.className = 'bi bi-eye-slash';
            } else {
                inp.type = 'password';
                icon.className = 'bi bi-eye';
            }
        });

        // ========== LOGIN ==========
        document.getElementById('formLogin').addEventListener('submit', function(e) {
            e.preventDefault();
            var btn = document.getElementById('btnLogin');
            btn.classList.add('loading');
            var msg = document.getElementById('mensaje');

            fetch('/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include',
                body: JSON.stringify({
                    correo: document.getElementById('correo').value,
                    contrasena: document.getElementById('contrasena').value
                })
            })
            .then(function(r) { return r.json().then(function(d){ return {status:r.status, d:d}; }); })
            .then(function(w) {
                btn.classList.remove('loading');
                var data = w.d || {};
                if (w.status === 429) {
                    msg.innerHTML = '<div class="alert alert-danger-custom">Límite de peticiones alcanzado. Por favor, espera unos segundos.</div>';
                    return;
                }
                if (data.exito && data.usuario) {
                    localStorage.setItem('usuario', JSON.stringify(data.usuario));
                    msg.innerHTML = '<div class="alert alert-success-custom">' + data.mensaje + '<br>Bienvenido ' + data.usuario.nombre + '</div>';
                    setTimeout(function() { window.location.href = '/app'; }, 1000);
                } else {
                    msg.innerHTML = '<div class="alert alert-danger-custom">' + data.mensaje + '</div>';
                }
            })
            .catch(function() {
                btn.classList.remove('loading');
                msg.innerHTML = '<div class="alert alert-danger-custom">No se pudo conectar con el servidor</div>';
            });
        });

        // ========== RECUPERAR CONTRASENA ==========
        function enviarRecuperacion() {
            var correo = document.getElementById('correoRecuperar').value.trim();
            var msg = document.getElementById('msgRecuperar');
            if (!correo) {
                msg.innerHTML = '<div class="alert alert-danger-custom mt-2" style="border-radius:10px;font-size:0.82rem">Ingresa tu correo electronico.</div>';
                return;
            }

            msg.innerHTML = '<div class="alert" style="background:rgba(255,165,0,0.15);color:#ffc832;border:1px solid rgba(255,165,0,0.2);border-radius:10px;font-size:0.82rem;margin-top:12px"><i class="bi bi-hourglass-split me-1"></i> Procesando...</div>';

            fetch('/api/recuperar-contrasena', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ correo: correo })
            })
            .then(function(r) { return r.json(); })
            .then(function(data) {
                if (data.exito) {
                    msg.innerHTML = '<div class="alert alert-success-custom mt-2" style="border-radius:10px;font-size:0.82rem"><i class="bi bi-envelope-check me-1"></i> 📩 Instrucciones enviadas.<br><small>Revisa tu bandeja de entrada para restablecer tu contraseña.</small></div>';
                } else {
                    msg.innerHTML = '<div class="alert alert-danger-custom mt-2" style="border-radius:10px;font-size:0.82rem">' + (data.mensaje || 'No se pudo procesar la solicitud.') + '</div>';
                }
            })
            .catch(function() {
                msg.innerHTML = '<div class="alert alert-danger-custom mt-2" style="border-radius:10px;font-size:0.82rem">No se pudo conectar con el servidor.</div>';
            });
        }
    </script>

</body>
</html>
