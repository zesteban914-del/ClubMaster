<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa de Mesas - ClubMaster</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        html, body { width: 100%; max-width: 100%; overflow-x: hidden; }
        .mesa-card {
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            border-radius: 12px;
            min-width: 0;
        }
        .mesa-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.15);
        }
        .mesa-disponible {
            border: 2px solid #198754;
            background-color: #f8fff9;
        }
        .mesa-ocupada {
            border: 2px solid #dc3545;
            background-color: #fff8f8;
        }
        .mesa-reservada {
            border: 2px solid #ffc107;
            background-color: #fffdf5;
        }
        .mesa-card .badge { max-width: 100%; white-space: normal; overflow-wrap: anywhere; }
        @media (max-width: 480px) {
            /* Una sola columna en telefonos angostos (375/390/428): tarjetas aireadas, nada cortado */
            #contenedorMesas > [class*="col-"] { flex: 0 0 100%; max-width: 100%; }
            #contenedorMesas .mesa-card { padding: 1.1rem !important; }
            .container.py-4 { padding-left: 14px; padding-right: 14px; }
            .d-flex.justify-content-between.align-items-center.mb-4 { flex-wrap: wrap; gap: 10px; }
            .d-flex.justify-content-between.align-items-center.mb-4 h2 { font-size: 1.2rem; margin: 0; }
            .d-flex.justify-content-between.align-items-center.mb-4 .btn { min-height: 42px; flex-shrink: 0; }
        }
    </style>
</head>
<body class="bg-light">

    <div class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Mapa de Mesas</h2>
            <button class="btn btn-outline-primary btn-sm" onclick="cargarMesas()">
                🔄 Actualizar
            </button>
        </div>

        <!-- Mensajes de alerta -->
        <div id="mensaje"></div>

        <!-- Grilla de Mesas Dinámica -->
        <div class="row g-3" id="contenedorMesas">
            <!-- Se renderiza desde JS -->
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() { cargarMesas(); });

        function cargarMesas() {
            var contenedor = document.getElementById('contenedorMesas');
            if (!contenedor) return;
            contenedor.innerHTML = '<div class="text-center py-5"><div class="spinner-border text-primary"></div></div>';
            fetch('/api/mesas')
                .then(function(r) { if (!r.ok) throw new Error('Error'); return r.json(); })
                .then(function(data) {
                    if (data.success) renderizarGrilla(data.mesas);
                    else mostrarAlerta('danger', data.mensaje);
                })
                .catch(function() { mostrarAlerta('danger', 'No se pudo conectar con el servidor'); });
        }

        function renderizarGrilla(mesas) {
            var contenedor = document.getElementById('contenedorMesas');
            contenedor.innerHTML = '';
            if (mesas.length === 0) { contenedor.innerHTML = '<p class="text-muted text-center">No hay mesas.</p>'; return; }
            mesas.forEach(function(mesa) {
                var clase = '', badge = '';
                if (mesa.estado === 'Disponible') { clase = 'mesa-disponible'; badge = 'bg-success'; }
                else if (mesa.estado === 'Ocupada') { clase = 'mesa-ocupada'; badge = 'bg-danger'; }
                else if (mesa.estado === 'Reservada') { clase = 'mesa-reservada'; badge = 'bg-warning text-dark'; }
                else { clase = 'border-secondary'; badge = 'bg-secondary'; }
                var col = document.createElement('div');
                col.className = 'col-6 col-sm-4 col-md-3 col-lg-2';
                col.innerHTML = '<div class="card mesa-card ' + clase + ' text-center p-3 h-100" onclick="seleccionarMesa(' + mesa.id_mesa + ',\'' + mesa.estado + '\')"><div class="card-body p-2 d-flex flex-column justify-content-between"><h5 class="card-title fw-bold mb-1">Mesa ' + mesa.numero + '</h5><p class="card-text text-muted small mb-2">Capacidad: ' + mesa.capacidad + '</p><div><span class="badge ' + badge + '">' + mesa.estado + '</span></div></div></div>';
                contenedor.appendChild(col);
            });
        }

        function seleccionarMesa(idMesa, estado) {
            if (estado === 'Disponible') window.location.href = 'comandero.html?id_mesa=' + idMesa;
            else if (estado === 'Ocupada') window.location.href = 'detalle-pedido.html?id_mesa=' + idMesa;
        }

        function mostrarAlerta(tipo, msg) {
            var d = document.getElementById('mensaje');
            if (d) d.innerHTML = '<div class="alert alert-' + tipo + ' alert-dismissible fade show">' + msg + '<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>';
        }
    </script>
</body>
</html>
